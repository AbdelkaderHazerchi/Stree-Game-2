<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <!-- Outer frame / border - exact match to screenshot gray #8B97AB -->
  <rect x="0" y="0" width="300" height="300" fill="#8B97AB"/>
  <!-- Top dark section (roof / upper wall) - screenshot dark #1E2126 -->
  <rect x="6" y="6" width="288" height="168" fill="#1E2126"/>
  <!-- Bottom gray wall - screenshot #6F7E94 -->
  <rect x="6" y="174" width="288" height="120" fill="#6F7E94"/>
  <!-- Separator line between top/bottom -->
  <rect x="6" y="174" width="288" height="4" fill="#8B97AB" opacity="0.95"/>
  <!-- Inner subtle highlight at bottom edge of dark section -->
  <rect x="6" y="170" width="288" height="2" fill="rgba(255,255,255,0.04)"/>

  <!-- AC Unit 1 (upper) -->
  <g>
    <rect x="68" y="64" width="88" height="28" fill="#D6D9DF" stroke="none"/>
    <rect x="68" y="92" width="88" height="8" fill="#8A8D93"/>
    <!-- black vents -->
    <ellipse cx="92" cy="78" rx="17" ry="12" fill="#070A0F"/>
    <ellipse cx="132" cy="78" rx="17" ry="12" fill="#070A0F"/>
  </g>

  <!-- AC Unit 2 (lower) -->
  <g>
    <rect x="68" y="126" width="88" height="28" fill="#D6D9DF"/>
    <rect x="68" y="154" width="88" height="8" fill="#8A8D93"/>
    <ellipse cx="92" cy="140" rx="17" ry="12" fill="#070A0F"/>
    <ellipse cx="132" cy="140" rx="17" ry="12" fill="#070A0F"/>
  </g>

  <!-- POLICE text -->
  <text x="18" y="210" font-family="Arial Black, Arial, sans-serif" font-size="32" font-weight="900" fill="#0A0D0F" letter-spacing="1.5">POLICE</text>

  <!-- Yellow star -->
  <g transform="translate(232, 204) scale(1)">
    <!-- star shape centered -->
    <path d="M 0 -18 L 5.2 -5.8 L 18.5 -5.4 L 8.2 2.2 L 11.2 15.2 L 0 7.2 L -11.2 15.2 L -8.2 2.2 L -18.5 -5.4 L -5.2 -5.8 Z"
          fill="#CFC000" stroke="#2F3300" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- inner highlight -->
    <path d="M 0 -12 L 3.4 -3.8 L 12.1 -3.5 L 5.4 1.4 L 7.3 10 L 0 5.5 L -7.3 10 L -5.4 1.4 L -12.1 -3.5 L -3.4 -3.8 Z"
          fill="#E6D600" opacity="0.9"/>
  </g>

  <!-- Blue glass / panel -->
  <rect x="44" y="238" width="128" height="30" rx="1" ry="1" fill="#1B3250" stroke="#0F1E32" stroke-width="1"/>

  <!-- Black door (rightmost) -->
  <rect x="238" y="232" width="38" height="56" rx="1" ry="1" fill="#080A0F" stroke="#000000" stroke-width="0.5"/>
  <!-- door highlight edge -->
  <rect x="238" y="232" width="38" height="2" fill="rgba(255,255,255,0.06)"/>
  <!-- right edge shadow -->
  <rect x="296" y="6" width="4" height="288" fill="rgba(0,0,0,0.18)"/>
  <rect x="6" y="296" width="288" height="4" fill="rgba(0,0,0,0.18)"/>
</svg>
